services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diffpl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diffpl}
      POSTGRES_DB: ${POSTGRES_DB:-diffpl}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diffpl}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "pip install --quiet psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-diffpl}:${POSTGRES_PASSWORD:-diffpl}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlartifacts:/mlartifacts

volumes:
  pgdata:
  mlartifacts:

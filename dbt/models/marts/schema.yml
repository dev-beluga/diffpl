version: 2

models:
  - name: mart_gameweek_deadlines
    description: Deadline per season and GW. Replay reads rows with as_of before this time.
    columns:
      - name: season
        tests: [not_null]
      - name: gw
        tests: [not_null]
      - name: deadline_time
        tests: [not_null]
  - name: mart_player_deadline_prices
    description: Price, ownership and transfers per player at each deadline; as_of = deadline - 1 minute.
    columns:
      - name: price_tenths
        tests: [not_null]
      - name: as_of
        tests: [not_null]

# FPL rules for 2024/25.
# Sources:
#   pl: premierleague.com/news/4193484 (Assistant Manager chip).
#   sec: secondary coverage of 2024/25 changes (goalkeeper goals raised from 6 to 10;
#        bank up to 5 free transfers). See unverified.
#   carried: same as 2025/26. No DefCon this season. BPS is not encoded.
season: "2024-25"

squad:
  size: 15
  starting: 11
  budget_tenths: 1000
  max_per_team: 3
  positions:
    GKP: {select: 2, min_play: 1, max_play: 1}
    DEF: {select: 5, min_play: 3, max_play: 5}
    MID: {select: 5, min_play: 2, max_play: 5}
    FWD: {select: 3, min_play: 1, max_play: 3}

transfers:
  free_per_gw: 1
  max_banked: 5              # sec
  hit_cost: 4
  sell_on_fee: 0.5

chips:
  - {name: wildcard, start_gw: 2, end_gw: 19}
  - {name: wildcard, start_gw: 20, end_gw: 38}
  - {name: freehit, start_gw: 2, end_gw: 38}
  - {name: bboost, start_gw: 1, end_gw: 38}
  - {name: 3xc, start_gw: 1, end_gw: 38}
  # pl: playable from GW24, active for three consecutive GWs.
  - {name: manager, start_gw: 24, end_gw: 36, duration_gws: 3}

scoring:
  minutes:
    short_play: 1            # carried: 1-59 minutes
    long_play: 2             # carried: 60+ minutes
    long_play_threshold: 60  # carried
  goals_scored: {GKP: 10, DEF: 6, MID: 5, FWD: 4}       # sec: GKP raised from 6
  assists: 3                                              # carried
  clean_sheets: {GKP: 4, DEF: 4, MID: 1, FWD: 0}        # carried; needs 60+ minutes (carried)
  goals_conceded: {GKP: -1, DEF: -1, MID: 0, FWD: 0}    # carried; per goals_conceded_per
  goals_conceded_per: 2                                   # carried
  saves: 1                                                # carried; per saves_per
  saves_per: 3                                            # carried
  penalties_saved: 5                                      # carried
  penalties_missed: -2                                    # carried
  yellow_cards: -1                                        # carried
  red_cards: -3                                           # carried
  own_goals: -2                                           # carried
  bonus_by_rank: [3, 2, 1]                                # carried; ties share the rank
  assistant_manager:         # pl
    win: 6
    draw: 3
    goal: 1
    clean_sheet: 2
    table_bonus_win: 10
    table_bonus_draw: 5
    table_bonus_min_gap: 5   # opponent at least five league places higher

# Player scoring (all of `scoring` except bonus_by_rank) is verified: tests/test_scoring_seasons.py
# recomputes every player-match in the season from this file and matches FPL's total_points.
unverified:
  - squad
  - transfers
  - chips[].start_gw
  - chips[].end_gw
  - scoring.bonus_by_rank

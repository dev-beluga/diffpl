# FPL rules for 2025/26.
# Sources:
#   pl: premierleague.com/en/news/4373187 (2025/26 changes): two sets of chips, no
#       Assistant Manager, DefCon 2 points at 10 CBIT (DEF) and 12 CBIRT (MID, FWD).
#   carried: same values as the 2026/27 API config, which FPL describes as unchanged
#       apart from BPS. BPS for 2025/26 is not encoded.
# Special case: free transfers were topped up to 5 at GW16 (AFCON); replay must apply it.
season: "2025-26"

squad:                       # carried
  size: 15
  starting: 11
  budget_tenths: 1000
  max_per_team: 3
  positions:
    GKP: {select: 2, min_play: 1, max_play: 1}
    DEF: {select: 5, min_play: 3, max_play: 5}
    MID: {select: 5, min_play: 2, max_play: 5}
    FWD: {select: 3, min_play: 1, max_play: 3}

transfers:
  free_per_gw: 1             # carried
  max_banked: 5              # carried: max_extra_free_transfers 4, plus the weekly one
  hit_cost: 4                # carried
  sell_on_fee: 0.5           # carried: half of any price rise, rounded down to 0.1m

chips:                       # pl: two sets, first set ends at GW19
  - {name: wildcard, start_gw: 2, end_gw: 19}
  - {name: wildcard, start_gw: 20, end_gw: 38}
  - {name: freehit, start_gw: 2, end_gw: 19}
  - {name: freehit, start_gw: 20, end_gw: 38}
  - {name: bboost, start_gw: 1, end_gw: 19}
  - {name: bboost, start_gw: 20, end_gw: 38}
  - {name: 3xc, start_gw: 1, end_gw: 19}
  - {name: 3xc, start_gw: 20, end_gw: 38}

scoring:
  minutes:
    short_play: 1            # carried: 1-59 minutes
    long_play: 2             # carried: 60+ minutes
    long_play_threshold: 60  # carried
  goals_scored: {GKP: 10, DEF: 6, MID: 5, FWD: 4}       # carried
  assists: 3                                              # carried
  clean_sheets: {GKP: 4, DEF: 4, MID: 1, FWD: 0}        # carried; needs 60+ minutes (carried)
  goals_conceded: {GKP: -1, DEF: -1, MID: 0, FWD: 0}    # carried; per goals_conceded_per
  goals_conceded_per: 2                                   # carried
  saves: 1                                                # carried; per saves_per
  saves_per: 3                                            # carried
  penalties_saved: 5                                      # carried
  penalties_missed: -2                                    # carried
  yellow_cards: -1                                        # carried
  red_cards: -3                                           # carried
  own_goals: -2                                           # carried
  bonus_by_rank: [3, 2, 1]                                # carried; ties share the rank
  defensive_contribution:
    points: {GKP: 0, DEF: 2, MID: 2, FWD: 2}             # carried
    # carried: DEF count clearances, blocks, interceptions, tackles (CBIT);
    # MID and FWD also count recoveries (CBIRT).
    threshold: {DEF: 10, MID: 12, FWD: 12}

special_events:
  topup_free_transfers_gw: 16

# Player scoring (all of `scoring` except bonus_by_rank) is verified: tests/test_scoring_seasons.py
# recomputes every player-match in the season from this file and matches FPL's total_points.
unverified:
  - squad
  - transfers
  - chips[].start_gw
  - chips[].end_gw
  - scoring.bonus_by_rank

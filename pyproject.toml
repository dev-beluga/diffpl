[project]
name = "diffpl"
version = "0.1.0"
description = "FPL decision lab with calibrated projections and leakage-free backtests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "jax[cpu]>=0.12.0",
    "lightgbm>=4.5",
    "matplotlib>=3.8",
    "mcp>=2.3.0",
    "mlflow-skinny>=2.16,<3",
    "numpy>=1.26",
    "numpyro>=0.22.0",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "dbt-postgres>=1.8",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffpl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["numpyro", "numpyro.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diffpl
          POSTGRES_PASSWORD: diffpl
          POSTGRES_DB: diffpl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diffpl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DIFFPL_TEST_DATABASE_URL: postgresql+psycopg://diffpl:diffpl@localhost:5432/diffpl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
